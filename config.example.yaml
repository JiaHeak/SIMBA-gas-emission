# Paths may be absolute or relative to this YAML file.
source:
  type: simba
  snapshot_filename: /scr/user/jiaheak/SIMBA_data/snap_m50n512_151.hdf5
  catalogue_filename: /scr/user/jiaheak/Octavius_results/output/octavius_snap_m50n512_151.hdf5
  redshift: auto  # Snapshot redshift; numerical overrides remain possible

selection:
  group_type: halo  # Current CGM filter supports halo targets only
  target_index: 0  # Octavius collection index, not ParticleID or HaloID
  # CGM filter currently uses r <= r200m and nH <= 0.13 cm^-3.

unit_factors:
  # Unit-scale conversion inputs below contain no a/h correction.
  # simba.compute_conversion_factors() keeps to_physical and to_units separate;
  # the emission pipeline combines both stages once.
  # SIMBA convention: comoving kpc/h, 1e10 Msun/h, and raw velocity * sqrt(a).
  # Catalogue positions/velocities are already converted by Octavius.
  # Use explicit signs in scientific exponents so PyYAML reads numbers.
  solar_mass_g: 1.988416e+33  # unit in g  
  kpc_to_cm: 3.0856775814913673e+21
  specific_energy_to_erg_g: 1.0e+10  # (km/s)^2 -> erg/g; no extra a or h factor
  # Dimensionless gas-model parameters, not unit or cosmological conversions:
  z_sun_mass_fraction: 0.0134
  # gamma: 1.6666666666666667  # Optional; default is 5/3

emissivity:
  type: cloudy_hdf5  # ps20 | cloudy_hdf5; both require one HDF5 table
  table_filename: /scr/user/jiaheak/Cloudy_tables/simba_hot_cgm_multiline.hdf5
  # Exact table identifiers, including spaces; output groups follow this order.
  line_labels:
    - 'O  7 21.6000A'
    - 'O  7 22.1000A'
    - 'O  8 18.9689A'
    - 'Ne 9 13.4500A'
    - 'Ne 9 13.7000A'
    - 'Ne10 12.1300A'
  # For PS20, for example:
  # type: ps20
  # table_filename: /scr/user/jiaheak/Cloudy_tables/UVB_dust1_CR1_G1_shield0_lines.hdf5
  # line_labels: ['H  1      6562.81A']

reference_frame:
  center_kpc: auto  # Default for Reader; stored coordinates remain in the box frame.
  bulk_velocity_kms: auto  # Three components; Reader can choose any LOS later.
  periodic: true

output:
  filename: particle_emission.hdf5
  # Existing outputs are not overwritten; choose a new filename for each run.
